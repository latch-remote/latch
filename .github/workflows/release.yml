name: release

# Two ways in:
#   * workflow_dispatch: build the binaries and leave them on the run page.
#   * a v* tag: verified assets published to latch-remote/latch-releases.
#     The tag must match Cargo.toml and a nonempty CHANGELOG.md section.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

# Let an in-flight publication finish before another run for the same ref.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    permissions:
      contents: read
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: ffmpeg for the encoder tests
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install ffmpeg
      # Never ship a binary whose tests were not run.
      - name: test
        run: cargo test --locked --workspace --all-targets
      - name: public manifest installer checks
        run: bash scripts/test-release-manifest.sh
      - name: build app
        run: cargo build --locked --release -p latch-host --target aarch64-apple-darwin
      # bundle-macos.sh ad-hoc signs and verifies the bundle itself.
      - name: bundle
        run: bash scripts/bundle-macos.sh
      # A Mac refuses an update whose bundle says another version than the
      # release, deletes the download and fetches it again 15 minutes later.
      - name: bundle version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          have="$(/usr/bin/plutil -extract CFBundleShortVersionString raw dist.noindex/Latch.app/Contents/Info.plist)"
          [ "$have" = "${GITHUB_REF_NAME#v}" ] || { echo "::error::tag ${GITHUB_REF_NAME} but the bundle says ${have}; bump the version in Cargo.toml"; exit 1; }
      - name: package
        run: |
          cp docs/MACOS.md dist.noindex/README-MACOS.md
          cp LICENSE NOTICE dist.noindex/
          cd dist.noindex && tar czf latch-macos-arm64.tar.gz Latch.app README-MACOS.md LICENSE NOTICE
      # A 4.0 updater downloads only its original archive and app names.
      # The same app under that folder name lets it update at all; on its
      # first run it moves itself to Latch.app
      # and takes over the launch agent (crates/host/src/unix_setup.rs,
      # adopt_legacy_bundle). Nothing in 4.1 or later reads this asset.
      - name: package for 4.0 updaters
        run: |
          mkdir dist.noindex/legacy
          ditto dist.noindex/Latch.app dist.noindex/legacy/BroLink.app
          cp docs/MACOS.md dist.noindex/legacy/README-MACOS.md
          cp LICENSE NOTICE dist.noindex/legacy/
          cd dist.noindex/legacy && tar czf ../brolink-macos-arm64.tar.gz BroLink.app README-MACOS.md LICENSE NOTICE
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: latch-macos-arm64
          overwrite: true
          path: |
            dist.noindex/latch-macos-arm64.tar.gz
            dist.noindex/brolink-macos-arm64.tar.gz
          if-no-files-found: error
          retention-days: 7

  windows:
    permissions:
      contents: read
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: test
        run: cargo test --locked --workspace --all-targets
      - name: build
        run: cargo build --locked --release -p latch-host
      - name: package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target\release\latch-host.exe dist\
          Copy-Item target\release\latch-host.exe latch-host.exe
          Copy-Item docs\WINDOWS.md dist\README-WINDOWS.md
          Copy-Item scripts\install-host.ps1, LICENSE, NOTICE dist\
          Compress-Archive -Path dist\* -DestinationPath latch-windows-x64.zip
      # A 4.0 Mac takes the host executable from its original archive and
      # sends it to each PC. The new program under the old name is what lets
      # it update the PC; nothing in 4.1 or later reads this asset.
      - name: package for 4.0 updaters
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force legacy | Out-Null
          Copy-Item target\release\latch-host.exe legacy\brolink-host.exe
          Copy-Item docs\WINDOWS.md legacy\README-WINDOWS.md
          Copy-Item scripts\install-host.ps1, LICENSE, NOTICE legacy\
          Compress-Archive -Path legacy\* -DestinationPath brolink-windows-x64.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: latch-windows-x64
          overwrite: true
          path: |
            latch-windows-x64.zip
            brolink-windows-x64.zip
            latch-host.exe
          if-no-files-found: error
          retention-days: 7

  # The Linux host, for VPS desktops: both production ones are arm64, x64 is
  # the other common kind. Built on Ubuntu 24.04 like CI, so it needs glibc
  # 2.39 or later. The Mac does not push updates to Linux hosts; they install
  # from here (deploy/native/README.md) and check the published SHA-256.
  linux:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Match the verified Ubuntu 24.04 runners used by CI.
          - runner: ${{ vars.LINUX_X64_RUNNER || 'ubuntu-24.04' }}
            arch: x64
            machine: x86_64
          - runner: ${{ vars.LINUX_ARM64_RUNNER || 'ubuntu-24.04-arm' }}
            arch: arm64
            machine: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: verify native architecture
        run: test "$(uname -m)" = '${{ matrix.machine }}'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: native deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libx11-xcb-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - name: test
        run: cargo test --locked --workspace --all-targets
      - name: build
        run: cargo build --locked --release -p latch-host
      - name: package
        run: |
          name="latch-host-linux-${{ matrix.arch }}"
          mkdir -p "dist/$name"
          cp target/release/latch-host LICENSE NOTICE "dist/$name/"
          cp -R deploy/native "dist/$name/native"
          tar -C dist -czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          cat "$name.tar.gz.sha256"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: latch-host-linux-${{ matrix.arch }}
          overwrite: true
          path: |
            latch-host-linux-${{ matrix.arch }}.tar.gz
            latch-host-linux-${{ matrix.arch }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

  codec-conformance:
    permissions:
      contents: read
    runs-on: ${{ vars.LINUX_X64_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: fetch the conformance bitstreams
        run: sh scripts/fetch-h264-conformance.sh
      - name: decode them
        run: cargo test --locked --release -p latch-codec --test conformance -- --nocapture

  assemble:
    # Manual builds also retain a complete, validated private release bundle.
    needs: [macos, windows, linux, codec-conformance]
    runs-on: ${{ vars.LINUX_X64_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: publisher tests
        run: python3 -m unittest discover -s scripts -p 'test_publish_release.py' -v
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: latch-*
          path: artifacts
      - name: prepare bounded public asset set and corresponding source
        env:
          TAG_BUILD: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
        run: |
          tag=()
          if [ "$TAG_BUILD" = true ]; then tag=(--tag "$GITHUB_REF_NAME"); fi
          python3 scripts/publish-release.py prepare \
            --artifacts artifacts --output release-assets --notes notes.md "${tag[@]}"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        # Private-repository attestations require an eligible GitHub plan.
        # Enabled failures block publication.
        if: github.event.repository.private == false || vars.RELEASE_ATTESTATIONS_ENABLED == 'true'
        with:
          subject-path: |
            release-assets/*.tar.gz
            release-assets/*.zip
            release-assets/latch-host.exe
      - name: report unavailable provenance
        if: github.event.repository.private && vars.RELEASE_ATTESTATIONS_ENABLED != 'true'
        run: echo 'Provenance is disabled for this private repository. Set RELEASE_ATTESTATIONS_ENABLED=true after verifying plan entitlement. Asset checksums were generated.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-bundle
          overwrite: true
          path: |
            release-assets/
            notes.md
          if-no-files-found: error
          retention-days: 7

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: assemble
    runs-on: ${{ vars.LINUX_X64_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-bundle
          path: publication
      # This App is installed only on the public distribution repository.
      # It never receives source-repository or organization administration access.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: release-token
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: latch-remote
          repositories: latch-releases
          permission-contents: write
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: verify draft assets and publish public release
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
        run: |
          python3 scripts/publish-release.py publish \
            --assets publication/release-assets --notes publication/notes.md --tag "$GITHUB_REF_NAME"
