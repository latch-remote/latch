name: advisories

# Known vulnerabilities in the locked dependencies (RustSec). It runs when
# the dependencies change and once a day. Every pull request gets a result
# so this job can be required without path-filtered checks staying pending.
on:
  push:
    branches: [main, master]
    paths: [Cargo.lock, "**/Cargo.toml", .github/workflows/advisories.yml]
  pull_request:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: advisories-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cargo-audit:
    permissions:
      contents: read
    runs-on: ${{ vars.LINUX_X64_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # A prebuilt, pinned cargo-audit: nothing to compile, and the same
      # tool every run.
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: cargo-audit@0.22.2
      # A vulnerability fails the job; unmaintained or yanked crates are
      # printed as warnings. Every ignored advisory says why it does not
      # apply:
      # - RUSTSEC-2026-0194, RUSTSEC-2026-0195: quick-xml 0.30 under
      #   zbus_xml, from accesskit's Linux screen-reader bridge. It parses
      #   the D-Bus interface descriptions shipped in those crates; nothing
      #   gives it untrusted XML. It goes with the next eframe upgrade.
      - name: cargo audit
        run: >-
          cargo audit
          --ignore RUSTSEC-2026-0194
          --ignore RUSTSEC-2026-0195
