name: pairs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pairs-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  produce:
    name: Record ${{ matrix.platform }}
    timeout-minutes: 19
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-latest, platform: windows-x86_64 }
          - { runner: macos-15, platform: macos-aarch64 }
          - { runner: ubuntu-24.04, platform: linux-x86_64 }
          - { runner: ubuntu-24.04-arm, platform: linux-aarch64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: pairs-v1-${{ matrix.platform }}
          save-if: ${{ github.event_name != 'pull_request' }}
      - name: Linux runtime and isolated display
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libx11-xcb-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev xvfb
      - name: Build test peers and assert runner architecture
        run: python3 scripts/pairs.py build --runner ${{ matrix.platform }}
      - name: Record sessions and viewer control, run live loopback
        run: python3 scripts/pairs.py record --runner ${{ matrix.platform }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pairs-recording-${{ matrix.platform }}
          path: target/pairs/recordings
          if-no-files-found: error
          retention-days: 7
      # Consumer jobs run their own OS's compiled peers. Reusing these binaries
      # avoids a second cold Rust/UI build on the hosted runner critical path.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pairs-bin-${{ matrix.platform }}
          path: target/pairs/bin
          if-no-files-found: error
          retention-days: 1

  consume:
    name: Replay on ${{ matrix.platform }}
    needs: produce
    timeout-minutes: 6
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-latest, platform: windows-x86_64 }
          - { runner: macos-15, platform: macos-aarch64 }
          - { runner: ubuntu-24.04, platform: linux-x86_64 }
          - { runner: ubuntu-24.04-arm, platform: linux-aarch64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Linux runtime and isolated display
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2t64 libxkbcommon0 libwayland-client0 libx11-6 libxcursor1 libxrandr2 libxi6 libx11-xcb1 libxcb-render0 libxcb-shape0 libxcb-xfixes0 xvfb
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: pairs-recording-*
          path: target/pairs/artifacts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pairs-bin-${{ matrix.platform }}
          path: target/pairs/bin
      - name: Verify every artifact, media decoder and native control adapter
        run: python3 scripts/pairs.py verify --grid --runner ${{ matrix.platform }} --artifacts target/pairs/artifacts --output target/pairs/results
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: pairs-results-${{ matrix.platform }}
          path: target/pairs/results
          if-no-files-found: error
          retention-days: 7
