name: ci

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

# A newer push to the same pull request replaces its older run; main keeps
# every run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Unit/UI tests use local probe fixtures. Keep them off the production relay.
  LATCH_NETENV_PROBE: "0"
  RUSTFLAGS: "-D warnings"

jobs:
  test-windows:
    permissions:
      contents: read
    runs-on: windows-latest
    # A hung test fails the job instead of holding a runner for hours.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --locked --workspace --all-targets --no-fail-fast
      - name: relay carrier timing
        run: cargo test --locked -p latch-relay --test carrier_throughput -j 4 -- --nocapture
      # The setup script is generated, so only a dump of it can be parsed.
      # Every plan shape, with names that need quoting, through the parser
      # of the Windows PowerShell that runs it; plus the shipped scripts.
      - name: PowerShell scripts parse
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $env:LATCH_DUMP_EXE = "C:\Users\O'Brien `$lab\AppData\Local\Latch\latch-host.exe"
          $env:LATCH_DUMP_ADAPTER = "Ethernet 'Realtek' `"2`" `$(x)"
          $env:LATCH_DUMP_ADAPTER_DESC = "Realtek PCIe GbE (`"x`")"
          $out = Join-Path $env:RUNNER_TEMP "setup.ps1"
          $env:LATCH_DUMP_SETUP_SCRIPT = $out
          $stage = Join-Path $env:RUNNER_TEMP "stage.ps1"
          $env:LATCH_DUMP_STAGE_SCRIPT = $stage
          $uninstall = Join-Path $env:RUNNER_TEMP "uninstall.ps1"
          $env:LATCH_DUMP_UNINSTALL_SCRIPT = $uninstall
          cargo test -q --locked -p latch-host --lib the_generated_script_can_be_dumped_for_a_syntax_check
          if ($LASTEXITCODE -ne 0) { throw "dumping the setup script failed" }
          $files = @('scripts\install-host.ps1', 'scripts\setup-protection.ps1', 'scripts\test-setup-protection.ps1', $out, $stage, "$stage.launch.ps1", $uninstall, "$uninstall.user.ps1")
          foreach ($f in $files) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f), [ref]$null, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { $errors | Format-List | Out-String | Write-Host; throw "$f does not parse" }
            Write-Host "parses: $f"
          }
      - name: virtual display setup restores rejected settings and continues
        shell: powershell
        run: |
          $env:LATCH_DUMP_VDD_SCRIPT = Join-Path $env:RUNNER_TEMP 'vdd.ps1'
          cargo test -q --locked -p latch-host --lib the_step_lists_every_mode_keeps_the_file_and_restarts_only_on_change
          if ($LASTEXITCODE -ne 0) { throw "dumping the display step failed" }
          scripts/test-vdd-setup.ps1 -Script $env:LATCH_DUMP_VDD_SCRIPT
      - name: setup rejects writable paths and reparse points
        shell: powershell
        run: scripts/test-setup-protection.ps1
      # Exercise cleanup on an isolated folder and a dummy service, twice.
      - name: retire the previous streaming service
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # The real retirement guard checks every ancestor. RUNNER_TEMP
          # lives below the user-writable D:\a on hosted Windows runners.
          $fixture = Join-Path ([IO.Path]::GetPathRoot($env:SystemRoot)) ('LatchRetireSelftest-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $fixture | Out-Null
          $acl = New-Object Security.AccessControl.DirectorySecurity
          $acl.SetSecurityDescriptorSddlForm('O:BAG:BAD:P(A;OICI;FA;;;SY)(A;OICI;FA;;;BA)')
          Set-Acl -LiteralPath $fixture -AclObject $acl
          $old = Join-Path $fixture 'old-engine'
          $svc = 'LatchRetireSelftest'
          $script = Join-Path $env:RUNNER_TEMP 'retire.ps1'
          $env:LATCH_DUMP_RETIRE_SCRIPT = $script
          $env:LATCH_DUMP_RETIRE_OLD = $old
          $env:LATCH_DUMP_RETIRE_SERVICE = $svc
          cargo test -q --locked -p latch-host --lib the_retire_step_can_be_dumped_for_a_windows_run
          if ($LASTEXITCODE -ne 0) { throw "dumping the retire step failed" }
          New-Item -ItemType Directory -Force $old | Out-Null
          Set-Content -LiteralPath (Join-Path $old 'old-state.json') -Value '{}'
          sc.exe create $svc binPath= "$env:WINDIR\System32\cmd.exe" start= demand | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "dummy service creation failed" }
          if ((Get-Service -Name $svc).Status -ne 'Stopped') { throw "dummy service must start stopped" }
          foreach ($attempt in 1..2) {
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $script
            if ($LASTEXITCODE -ne 0) { throw "retirement failed" }
            if (Test-Path -LiteralPath $old) { throw "old folder remains" }
          }
          if (Get-Service -Name $svc -ErrorAction SilentlyContinue) { throw "old service remains" }
          Remove-Item -LiteralPath $fixture -Recurse -Force
          exit 0
      # Setup's record of the power settings and --uninstall's
      # administrator part, on this throwaway runner: the rules and the
      # record go, the power settings come back, and a second run finds
      # nothing left to do. No adapter is named, so no network card is
      # touched.
      - name: uninstall reverses setup
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Join-Path $env:RUNNER_TEMP 'run-setup.ps1'
          $uninstall = Join-Path $env:RUNNER_TEMP 'run-uninstall.ps1'
          $env:LATCH_DUMP_SETUP_SCRIPT = $setup
          $env:LATCH_DUMP_UNINSTALL_SCRIPT = $uninstall
          cargo test -q --locked -p latch-host --lib the_generated_script_can_be_dumped_for_a_syntax_check
          if ($LASTEXITCODE -ne 0) { throw "dumping the scripts failed" }
          function AcIndex($setting) {
            $hex = [regex]::Matches((powercfg /query SCHEME_CURRENT SUB_SLEEP $setting | Out-String), '0x[0-9a-fA-F]{8}')
            [Convert]::ToUInt32($hex[$hex.Count - 2].Value, 16)
          }
          powercfg /setacvalueindex SCHEME_CURRENT SUB_SLEEP STANDBYIDLE 1234
          powercfg /setacvalueindex SCHEME_CURRENT SUB_SLEEP HIBERNATEIDLE 4321
          powercfg /setactive SCHEME_CURRENT
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $setup | Out-Host
          if (-not (Test-Path 'HKLM:\SOFTWARE\Latch\Setup')) { throw "setup recorded nothing" }
          if ((AcIndex STANDBYIDLE) -ne 0) { throw "setup left the sleep timeout" }
          if (-not (netsh advfirewall firewall show rule name="Latch Host" | Select-String 'fd7a:115c:a1e0')) { throw "the rule lacks Tailscale's IPv6 range" }
          foreach ($attempt in 1..2) {
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $uninstall | Out-Host
            if ($LASTEXITCODE -ne 0) { throw "uninstall failed (run $attempt)" }
          }
          if ((AcIndex STANDBYIDLE) -ne 1234 -or (AcIndex HIBERNATEIDLE) -ne 4321) { throw "the power settings were not put back" }
          if (Test-Path 'HKLM:\SOFTWARE\Latch\Setup') { throw "the record remains" }
          foreach ($rule in 'Latch Host', 'Latch Media', 'Latch wake') {
            netsh advfirewall firewall show rule name="$rule" | Out-Null
            if ($LASTEXITCODE -eq 0) { throw "$rule remains" }
          }
          exit 0
      - name: release build
        run: cargo build --locked --workspace --release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: latch-host-windows
          path: target/release/latch-host.exe
          if-no-files-found: error
          retention-days: 3

  test-macos:
    permissions:
      contents: read
    runs-on: macos-15
    # A hung test fails the job instead of holding a runner for hours.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: release publisher manifest and publication checks
        run: python3 -m unittest discover -s scripts -p 'test_publish_release.py' -v
      - name: public manifest installer checks
        run: bash scripts/test-release-manifest.sh
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: aarch64-apple-darwin
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
      # FFmpeg decodes the VideoToolbox encoder's output in the tests: an
      # independent decoder, never part of Latch.
      - name: ffmpeg for the encoder tests
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install ffmpeg
      - name: clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --locked --workspace --all-targets --no-fail-fast
      - name: release app
        run: cargo build --locked --release -p latch-host --target aarch64-apple-darwin
      - name: bundle
        run: bash scripts/bundle-macos.sh

  test-linux-update-systemd:
    permissions:
      contents: read
    name: Linux updater systemd (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ${{ vars.LINUX_X64_RUNNER || 'ubuntu-24.04' }}
            arch: x64
          - runner: ${{ vars.LINUX_ARM64_RUNNER || 'ubuntu-24.04-arm' }}
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
      - name: native deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libx11-xcb-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - name: real systemd restart, health rollback and killed supervisor recovery
        run: bash scripts/test-linux-update-systemd.sh

  # Set each runner variable only after verifying its Ubuntu 24.04 image
  # and architecture with the provider (including optional Blacksmith).
  # Unset variables use GitHub-hosted runners.
  test-linux:
    permissions:
      contents: read
    name: test-linux (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ${{ vars.LINUX_X64_RUNNER || 'ubuntu-24.04' }}
            arch: x64
            machine: x86_64
          - runner: ${{ vars.LINUX_ARM64_RUNNER || 'ubuntu-24.04-arm' }}
            arch: arm64
            machine: aarch64
    runs-on: ${{ matrix.runner }}
    # A hung test fails the job instead of holding a runner for hours.
    timeout-minutes: 45
    steps:
      - name: verify native architecture
        run: test "$(uname -m)" = '${{ matrix.machine }}'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
      # The Wayland unit tests load libpipewire at runtime, and its context
      # needs client.conf, which pipewire-bin ships.
      - name: native deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libx11-xcb-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libpipewire-0.3-dev pipewire-bin
      - name: clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --locked --workspace --all-targets --no-fail-fast
      - name: Linux updater local-manifest fixture and rollback
        run: cargo test --locked -p latch-core -j 4 linux_release_fixture_updates_and_rolls_back -- --nocapture
      - name: X11 capture recovery and media replay
        run: |
          set -o pipefail
          sudo apt-get install -y --no-install-recommends xvfb xauth
          xvfb-run -a cargo test --locked -p latch-client --lib -j 4 keyboard::linux::tests::watchdog_and_media_replay_restore_local_x11_delivery -- --ignored --exact 2>&1 | tee /tmp/latch-x11-test.log
          python3 - <<'PY'
          from pathlib import Path
          import re
          output = Path("/tmp/latch-x11-test.log").read_text()
          output = re.sub(r"\x1b\[[0-9;]*m", "", output)
          assert len(re.findall(r"^test result: ok\. 1 passed; 0 failed; 0 ignored;", output, re.MULTILINE)) == 1, output
          assert not re.search(r"^test result:.*\b0 passed;", output, re.MULTILINE), output
          PY
      - name: release host
        run: cargo build --locked --release -p latch-host
      - name: headless Wayland portal capture
        run: |
          sudo apt-get install -y --no-install-recommends sway swaybg grim pipewire wireplumber xdg-desktop-portal xdg-desktop-portal-wlr dbus-daemon meson ninja-build libpipewire-0.3-dev libinih-dev libgbm-dev libdrm-dev libsystemd-dev wayland-protocols
          cargo build --locked -p latch-engine --example wayland_smoke
          # Ubuntu 24.04 ships xdpw 0.7, which requires DMA-BUF even for SHM.
          # Apply the SHM-only fixture workaround after the Rust checks.
          git clone --depth 1 --branch v0.7.1 https://github.com/emersion/xdg-desktop-portal-wlr.git "$RUNNER_TEMP/xdpw"
          test "$(git -C "$RUNNER_TEMP/xdpw" rev-parse HEAD)" = 74428f2a8fa7f252e2a46fdf5b697536c66c8a1c
          git -C "$RUNNER_TEMP/xdpw" apply "$GITHUB_WORKSPACE/scripts/wayland-portal-shm.patch"
          meson setup "$RUNNER_TEMP/xdpw/build" "$RUNNER_TEMP/xdpw" -Dman-pages=disabled -Dc_args="-include unistd.h"
          ninja -C "$RUNNER_TEMP/xdpw/build"
          LATCH_TEST_PORTAL_WLR="$RUNNER_TEMP/xdpw/build/xdg-desktop-portal-wlr" scripts/test-wayland.sh
          layout_test=$(cargo test --locked -p latch-engine --lib --no-run --message-format=json | python3 -c 'import json,sys; print([m["executable"] for line in sys.stdin if (m := json.loads(line)).get("executable") and m.get("target", {}).get("name") == "latch_engine"][0])')
          LATCH_TEST_PORTAL_WLR="$RUNNER_TEMP/xdpw/build/xdg-desktop-portal-wlr" scripts/test-wayland.sh "$layout_test" --ignored --exact linux::wayland::layout::tests::live_layout_maps_each_monitor_into_the_whole_desktop
      - name: native TCP relay deployment checks
        run: |
          cargo build --locked -p latch-relay
          python3 deploy/relay-tcp/selftest.py --binary target/debug/latch-relay
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: latch-host-linux-${{ matrix.arch }}
          path: target/release/latch-host
          if-no-files-found: error
          retention-days: 3

  deploy-selftest:
    permissions:
      contents: read
    runs-on: ${{ vars.LINUX_X64_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: node kit selftest
        run: bash deploy/node/selftest.sh
  native-display-selftest:
    permissions:
      contents: read
    runs-on: ${{ vars.LINUX_X64_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y xauth
      - run: bash deploy/native/selftest.sh
  relay-selftest:
    permissions:
      contents: read
    runs-on: ${{ vars.LINUX_X64_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: relay installer selftest
        run: bash deploy/relay/selftest.sh

  # Nothing Latch builds may compile C, C++ or assembler (docs/ENGINE.md).
  native-audit:
    permissions:
      contents: read
    runs-on: ${{ vars.LINUX_X64_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
      - name: no C, C++ or assembler in the build graph
        run: bash scripts/audit-native.sh

  # The H.264 decoder against the ITU-T H.264.1 conformance bitstreams:
  # every picture must equal the reference decoder's output byte for byte.
  codec-conformance:
    permissions:
      contents: read
    runs-on: ${{ vars.LINUX_X64_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
      - name: fetch the conformance bitstreams
        run: sh scripts/fetch-h264-conformance.sh
      - name: decode them
        run: cargo test --locked --release -p latch-codec --test conformance -- --nocapture
